<text x="150" y="120" font-size="12" text-anchor="start" fill="#be185d">离子浓度 c(x)：近光侧高</text>
<text x="128" y="262" font-size="18" text-anchor="middle" font-weight="700" fill="#475569">− − − −</text>
<text x="128" y="280" font-size="11" text-anchor="middle" fill="#52606d">慢的 C4AZO⁻ 滞后</text>
<text x="380" y="262" font-size="18" text-anchor="middle" font-weight="700" fill="#be185d">+ + + +</text>
<text x="380" y="280" font-size="11" text-anchor="middle" fill="#52606d">快的 Co²⁺ 领先</text>
<line x1="372" y1="318" x2="138" y2="318" stroke="#1f2933" stroke-width="2.8" marker-end="url(#ah-k)"/>
<text x="255" y="340" font-size="12" text-anchor="middle" font-weight="700">E 由 + 指向 −：指向高浓度＝指向光源</text>
<g opacity="1.0"><path d="M304.9,440.6 Q315.1,439.7 322.1,442.9" stroke="#16a34a" stroke-width="1.24" fill="none" stroke-linecap="round"/><path d="M304.4,442.3 Q310.4,448.0 316.7,448.7" stroke="#16a34a" stroke-width="1.24" fill="none" stroke-linecap="round"/><path d="M303.4,443.7 Q308.0,452.7 315.1,456.4" stroke="#16a34a" stroke-width="1.24" fill="none" stroke-linecap="round"/><path d="M301.9,444.6 Q306.8,451.2 307.2,457.3" stroke="#16a34a" stroke-width="1.24" fill="none" stroke-linecap="round"/><path d="M300.2,445.0 Q298.0,454.9 301.0,462.3" stroke="#16a34a" stroke-width="1.24" fill="none" stroke-linecap="round"/><path d="M298.5,444.7 Q293.9,451.6 294.4,457.9" stroke="#16a34a" stroke-width="1.24" fill="none" stroke-linecap="round"/><path d="M297.0,443.9 Q292.7,453.2 286.4,457.7" stroke="#16a34a" stroke-width="1.24" fill="none" stroke-linecap="round"/><path d="M295.8,442.7 Q287.9,445.0 284.2,450.1" stroke="#16a34a" stroke-width="1.24" fill="none" stroke-linecap="round"/><path d="M295.2,441.1 Q284.9,440.6 278.2,444.9" stroke="#16a34a" stroke-width="1.24" fill="none" stroke-linecap="round"/><path d="M295.1,439.4 Q286.9,440.3 281.4,437.6" stroke="#16a34a" stroke-width="1.24" fill="none" stroke-linecap="round"/><path d="M295.6,437.7 Q288.1,430.8 280.2,429.7" stroke="#16a34a" stroke-width="1.24" fill="none" stroke-linecap="round"/><path d="M296.6,436.3 Q293.0,428.9 287.3,426.2" stroke="#16a34a" stroke-width="1.24" fill="none" stroke-linecap="round"/><path d="M298.1,435.4 Q292.2,427.1 291.4,419.4" stroke="#16a34a" stroke-width="1.24" fill="none" stroke-linecap="round"/><path d="M299.8,435.0 Q301.8,427.0 299.2,421.2" stroke="#16a34a" stroke-width="1.24" fill="none" stroke-linecap="round"/><path d="M301.5,435.3 Q307.0,426.7 306.7,418.7" stroke="#16a34a" stroke-width="1.24" fill="none" stroke-linecap="round"/><path d="M303.0,436.1 Q306.3,428.5 311.4,425.1" stroke="#16a34a" stroke-width="1.24" fill="none" stroke-linecap="round"/><path d="M304.2,437.3 Q313.9,434.3 318.8,428.0" stroke="#16a34a" stroke-width="1.24" fill="none" stroke-linecap="round"/><path d="M304.8,438.9 Q313.1,439.5 318.3,435.9" stroke="#16a34a" stroke-width="1.24" fill="none" stroke-linecap="round"/><circle cx="300" cy="440" r="6.2" fill="#facc15" stroke="#ca8a04" stroke-width="1"/></g>
<text x="330" y="474" font-size="11" text-anchor="start" fill="#52606d">ζ ≈ −40 mV</text>
<line x1="325" y1="424" x2="445" y2="424" stroke="#dc2626" stroke-width="3" marker-end="url(#ah-r)"/>
<text x="320" y="412" font-size="12" text-anchor="start" fill="#dc2626">电泳分量 ∝ β′ζ ≈ −6 mV：背离光源</text>
<line x1="275" y1="452" x2="123" y2="452" stroke="#059669" stroke-width="3" marker-end="url(#ah-g)"/>
<text x="120" y="472" font-size="12" text-anchor="start" fill="#059669">化学泳分量 ≈ +7.6 mV：朝高浓度</text>
<line x1="300" y1="502" x2="268" y2="502" stroke="#2563eb" stroke-width="3.2" marker-end="url(#ah-b)"/>
<text x="312" y="506" font-size="12" text-anchor="start" font-weight="700" fill="#2563eb">净值 ≈ +1.6 mV（两项几乎抵消）</text>
<text x="40" y="395" font-size="11" text-anchor="start" fill="#52606d">箭头长度 ∝ 各项贡献（1 mV ≈ 20 px）</text>
<rect x="580" y="58" width="364" height="452" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="596" y="86" font-size="12.5" text-anchor="start">零电流条件 ⇒ 扩散电场</text>
<text x="596" y="108" font-size="12.5" text-anchor="start">  E = (kT/e) · β′ · ∇ln c</text>
<text x="596" y="130" font-size="12.5" text-anchor="start">  β′ = (D₊ − D₋)/(z₊D₊ + |z₋|D₋)</text>
<text x="596" y="152" font-size="12.5" text-anchor="start"></text>
<text x="596" y="174" font-size="12.5" text-anchor="start">D(Co²⁺) ≈ 0.73×10⁻⁹ m²/s</text>
<text x="596" y="196" font-size="12.5" text-anchor="start">D(C4AZO⁻) ≈ 0.45×10⁻⁹ m²/s（Stokes 估算）</text>
<text x="596" y="218" font-size="12.5" text-anchor="start">⇒ β′ ≈ +0.15 &gt; 0 ⇒ E 指向高浓度（光源）</text>
<text x="596" y="240" font-size="12.5" text-anchor="start"></text>
<text x="596" y="262" font-size="12.5" text-anchor="start">扩散泳速度（Prieve–Anderson，z:z 近似）</text>
<text x="596" y="284" font-size="12.5" text-anchor="start">  U = (ε/η)(kT/e)[β′ζ − (2kT/e)ln(1−γ²)]∇ln c</text>
<text x="596" y="306" font-size="12.5" text-anchor="start">  γ = tanh(eζ/4kT)</text>
<text x="596" y="328" font-size="12.5" text-anchor="start"></text>
<text x="596" y="350" font-size="12.5" text-anchor="start">第一项（电泳）：β′ζ &lt; 0 → 负电粒子背离光源</text>
<text x="596" y="372" font-size="12.5" text-anchor="start">第二项（化学泳）：恒 &gt; 0 → 朝高浓度</text>
<text x="596" y="394" font-size="12.5" text-anchor="start"></text>
<text x="596" y="416" font-size="12.5" text-anchor="start">量级：净 ≈ 1.6 mV，∇ln c ≈ 1/(10–100 μm)</text>
<text x="596" y="438" font-size="12.5" text-anchor="start">  ⇒ |U| ≈ 0.1–1 μm/s，符号取决于实测 ζ、β′</text>
<text x="596" y="460" font-size="12.5" text-anchor="start">注：若 ζ 因吸附 Co²⁺ 而反号，结论再次改变；</text>
<text x="596" y="482" font-size="12.5" text-anchor="start">若顺式以胶束/寡聚体形式释放，β′ 也会改变。</text>
<rect x="16" y="530" width="456" height="76" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
<text x="244.0" y="555.0" font-size="12.5" text-anchor="middle">草稿：把 E 画成指向稀侧，且只计电泳项，</text>
<text x="244.0" y="572.5" font-size="12.5" text-anchor="middle">得出“负电星状体在 E 作用下朝 UV 运动”</text>
<text x="244.0" y="590.0" font-size="12.5" text-anchor="middle">——与其自身假设 D(Co²⁺) &gt; D(C4AZO⁻) 相矛盾</text>
<rect x="488" y="530" width="456" height="76" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
<text x="716.0" y="555.0" font-size="12.5" text-anchor="middle">修正：在该假设下，电泳项让负电星状体“背离” UV；</text>
<text x="716.0" y="572.5" font-size="12.5" text-anchor="middle">若确实正趋光，只能是化学泳占优或 ζ 反号，</text>
<text x="716.0" y="590.0" font-size="12.5" text-anchor="middle">而且速度仅 ~μm/s，无法解释 mm/s 的宏观运动（见图3、4）</text></svg>