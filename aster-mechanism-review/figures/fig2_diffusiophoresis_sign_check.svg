72b6" stop-opacity="0"/></radialGradient><radialGradient id="warm"><stop offset="0" stop-color="#f87171" stop-opacity="0.6"/><stop offset="1" stop-color="#f87171" stop-opacity="0"/></radialGradient><radialGradient id="glow"><stop offset="0" stop-color="#fde047" stop-opacity="0.8"/><stop offset="1" stop-color="#fde047" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="960" height="622" fill="#ffffff"/><text x="20" y="30" font-size="18" text-anchor="start" font-weight="700">图2  按草稿自身假设（D(Co²⁺) &gt; D(C4AZO⁻)、星状体 ζ &lt; 0）重新核对扩散泳方向</text>
